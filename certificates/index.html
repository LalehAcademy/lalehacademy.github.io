<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Verification — Laleh Academy</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=/verify/">
</head>
<body>
<script>
  // /certificates/ with no ID — send to the search page. If an id ever
  // arrives here via ?cert= (e.g. a bookmarked link from an older build),
  // forward it into the canonical route instead of losing it.
  var cert = new URLSearchParams(window.location.search).get("cert");
  window.location.replace(cert ? "/verify/?id=" + encodeURIComponent(cert) : "/verify/");
</script>
<p><a href="/verify/">Continue to certificate verification</a></p>
</body>
</html>
